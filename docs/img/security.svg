<svg xmlns="http://www.w3.org/2000/svg" width="593" height="479" viewBox="0 0 593 479" role="img" aria-label="fedora-setup --security">
<title>fedora-setup --security</title>
<style>text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;white-space:pre}.b{font-weight:700}</style>
<rect width="593" height="479" rx="10" fill="#1e2030"/>
<path d="M0 10a10 10 0 0 1 10-10h573a10 10 0 0 1 10 10v24H0z" fill="#2a2d42"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17" r="6" fill="#febc2e"/>
<circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="296" y="21" fill="#7f849c" text-anchor="middle">fedora-setup --security</text>
<text x="18" y="65" fill="#d6dbf5" xml:space="preserve"><tspan fill="#7f849c">$ </tspan><tspan fill="#d6dbf5" class="b">fedora-setup --security --dry-run --yes</tspan></text>
<text x="18" y="103" fill="#d6dbf5" xml:space="preserve"><tspan class="b">=== Fedora Setup v0.6.0 — sécurité &amp; réseau ===</tspan></text>
<text x="18" y="122" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb">Mode simulation : aucune modification ne sera appliquée.</tspan></text>
<text x="18" y="141" fill="#d6dbf5" xml:space="preserve"><tspan>    Journal  : </tspan><tspan fill="#f9e2af">tail -f /tmp/fedora-setup_20261028-225852.log</tspan></text>
<text x="18" y="179" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb" class="b">==&gt; SELinux</tspan></text>
<text x="18" y="198" fill="#d6dbf5" xml:space="preserve"><tspan>    SELinux : </tspan><tspan fill="#a6e3a1">Enforcing</tspan><tspan> (protection active)</tspan></text>
<text x="18" y="236" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb" class="b">==&gt; Pare-feu</tspan></text>
<text x="18" y="255" fill="#d6dbf5" xml:space="preserve"><tspan>    firewalld : </tspan><tspan fill="#a6e3a1">actif</tspan><tspan> (zone « FedoraWorkstation »)</tspan></text>
<text x="18" y="274" fill="#d6dbf5" xml:space="preserve"><tspan>    </tspan><tspan fill="#f9e2af">Cette zone laisse ouverts les ports UDP 1025-65535</tspan></text>
<text x="18" y="293" fill="#d6dbf5" xml:space="preserve"><tspan>    </tspan><tspan fill="#f9e2af">(partage de fichiers, découverte réseau). Sur un réseau</tspan></text>
<text x="18" y="312" fill="#d6dbf5" xml:space="preserve"><tspan>    </tspan><tspan fill="#f9e2af">public, la zone « public » est nettement plus stricte.</tspan></text>
<text x="18" y="331" fill="#d6dbf5" xml:space="preserve"><tspan>    Services ouverts : </tspan><tspan fill="#f9e2af">firewall-cmd --list-all</tspan></text>
<text x="18" y="350" fill="#d6dbf5" xml:space="preserve"><tspan>    Pour durcir : </tspan><tspan fill="#f9e2af">sudo firewall-cmd --set-default-zone=public</tspan></text>
<text x="18" y="388" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb" class="b">==&gt; Mises à jour automatiques</tspan></text>
<text x="18" y="407" fill="#d6dbf5" xml:space="preserve"><tspan>    Les mises à jour de sécurité peuvent être téléchargées</tspan></text>
<text x="18" y="426" fill="#d6dbf5" xml:space="preserve"><tspan>    automatiquement, avec notification (sans installation silencieuse).</tspan></text>
<text x="18" y="445" fill="#d6dbf5" xml:space="preserve"><tspan>    Installation de dnf5-plugin-automatic : </tspan><tspan fill="#89dceb">simulé</tspan></text>
<text x="18" y="464" fill="#d6dbf5" xml:space="preserve"><tspan>        </tspan><tspan class="b">$</tspan><tspan> dnf install -y dnf5-plugin-automatic</tspan></text>
</svg>
