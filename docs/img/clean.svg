<svg xmlns="http://www.w3.org/2000/svg" width="734" height="555" viewBox="0 0 734 555" role="img" aria-label="fedora-setup --clean">
<title>fedora-setup --clean</title>
<style>text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;white-space:pre}.b{font-weight:700}</style>
<rect width="734" height="555" rx="10" fill="#1e2030"/>
<path d="M0 10a10 10 0 0 1 10-10h714a10 10 0 0 1 10 10v24H0z" fill="#2a2d42"/>
<circle cx="20" cy="17" r="6" fill="#ff5f57"/>
<circle cx="40" cy="17" r="6" fill="#febc2e"/>
<circle cx="60" cy="17" r="6" fill="#28c840"/>
<text x="367" y="21" fill="#7f849c" text-anchor="middle">fedora-setup --clean</text>
<text x="18" y="65" fill="#d6dbf5" xml:space="preserve"><tspan fill="#7f849c">$ </tspan><tspan fill="#d6dbf5" class="b">fedora-setup --clean --dry-run</tspan></text>
<text x="18" y="103" fill="#d6dbf5" xml:space="preserve"><tspan class="b">=== Fedora Setup v0.4.0 — nettoyage &amp; maintenance ===</tspan></text>
<text x="18" y="122" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb">Mode simulation : aucune modification ne sera appliquée.</tspan></text>
<text x="18" y="141" fill="#d6dbf5" xml:space="preserve"><tspan>    Journal  : </tspan><tspan fill="#f9e2af">tail -f /tmp/fedora-setup_20261028-145857.log</tspan></text>
<text x="18" y="179" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb" class="b">==&gt; Paquets et cache DNF</tspan></text>
<text x="18" y="198" fill="#d6dbf5" xml:space="preserve"><tspan>    Suppression des paquets orphelins : </tspan><tspan fill="#89dceb">simulé</tspan></text>
<text x="18" y="217" fill="#d6dbf5" xml:space="preserve"><tspan>        </tspan><tspan class="b">$</tspan><tspan> dnf autoremove -y</tspan></text>
<text x="18" y="236" fill="#d6dbf5" xml:space="preserve"><tspan>    Purge du cache des paquets DNF : </tspan><tspan fill="#89dceb">simulé</tspan></text>
<text x="18" y="255" fill="#d6dbf5" xml:space="preserve"><tspan>        </tspan><tspan class="b">$</tspan><tspan> dnf clean packages</tspan></text>
<text x="18" y="293" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb" class="b">==&gt; Journal systemd</tspan></text>
<text x="18" y="312" fill="#d6dbf5" xml:space="preserve"><tspan>    Journal systemd avant nettoyage : 193.7M</tspan></text>
<text x="18" y="331" fill="#d6dbf5" xml:space="preserve"><tspan>    Réduction du journal à 200M : </tspan><tspan fill="#89dceb">simulé</tspan></text>
<text x="18" y="350" fill="#d6dbf5" xml:space="preserve"><tspan>        </tspan><tspan class="b">$</tspan><tspan> journalctl --vacuum-size=200M</tspan></text>
<text x="18" y="369" fill="#d6dbf5" xml:space="preserve"><tspan>    Plafond du journal déjà configuré (/etc/systemd/journald.conf.d/99-fedora-setup.conf)</tspan></text>
<text x="18" y="407" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb" class="b">==&gt; Anciens noyaux</tspan></text>
<text x="18" y="426" fill="#d6dbf5" xml:space="preserve"><tspan>    Noyaux installés : 3</tspan></text>
<text x="18" y="445" fill="#d6dbf5" xml:space="preserve"><tspan>    Suppression des anciens noyaux : </tspan><tspan fill="#89dceb">simulé</tspan></text>
<text x="18" y="464" fill="#d6dbf5" xml:space="preserve"><tspan>        </tspan><tspan class="b">$</tspan><tspan> dnf remove -y --oldinstallonly --setopt=installonly_limit=2</tspan></text>
<text x="18" y="502" fill="#d6dbf5" xml:space="preserve"><tspan fill="#89dceb" class="b">==&gt; Runtimes Flatpak</tspan></text>
<text x="18" y="521" fill="#d6dbf5" xml:space="preserve"><tspan>    Suppression des runtimes Flatpak inutilisés : </tspan><tspan fill="#89dceb">simulé</tspan></text>
<text x="18" y="540" fill="#d6dbf5" xml:space="preserve"><tspan>        </tspan><tspan class="b">$</tspan><tspan> flatpak uninstall --unused --noninteractive -y</tspan></text>
</svg>
